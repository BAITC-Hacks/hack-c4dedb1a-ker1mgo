# Every threshold and weight lives here, each with the reason it has this value.
# Change values here only, never in code.

temporal:
  fast_pass_days: 2            # money in and out within 2 days = rapid transit (ТЗ temporal hint)
  flags:
    repeat_amount_min: 5       # same amount sent >= 5 times; 42 senders do this
    round_unit: 10000          # 31% of all amounts are multiples of 10k
    round_share: 0.8           # most of a node's transfers are round
    near_threshold_range: [5000, 6000]
    near_threshold_min: 3      # >= 3 transfers just around 5-6k
    burst_share: 0.5           # half of a node's transfers on one day
    min_tx: 5                  # round_amounts and burst need enough transfers to mean anything

taint:
  rounds: 6                    # covers depth 4 plus back edges without letting cycles inflate flow

roles:
  coordinator:
    min_pays_seed: 2           # pays back into >= 2 distinct seeds; at 1 it matched 67 nodes (n_seed_sources >= 2 holds for 73%), at 2 it gives 22
    min_cycle_seeds: 2
    min_seed_sources: 2        # sits downstream of more than one seed
    betweenness_pct: 0.98
  distributor:
    min_out_deg: 10            # fan-out; data has hubs with 60-116 recipients
    out_in_ratio: 3
  consolidator:
    min_in_deg: 5              # ~50 nodes have >= 5 distinct payers
    max_pass_through: 0.5
    out_in_ratio: 0.333
  transit:
    pass_through_low: 0.8      # ТЗ: 72 nodes fall in 0.8-1.2
    pass_through_high: 1.2
    min_fast_pass_share: 0.5
    max_pass_through_fast: 2.0 # above this most money comes from outside the graph; fast pass-through alone is too weak
  terminal:
    max_p_has_out: 0.3         # depth-4 sink counts as terminal only below this
  truncated_likely_forwarding_p: 0.6

truncation:
  min_auc: 0.6                 # below this we don't trust the model and mark depth-4 sinks unknown

clusters:
  seed: 42                     # fixed so cluster ids are the same on every run
  resolution: 1.0              # default modularity; weighted run gives 44 communities, 8 with > 1 seed
  collection_min_seeds: 2      # consolidator fed by several seeds = collection cell
  layering_transit_share: 0.3  # a third of the group just passes money on
  periphery_terminal_share: 0.6

priority:
  weights:
    seed_flow: 0.30
    role: 0.25
    seed_sources: 0.15
    betweenness: 0.15
    removal_impact: 0.15
  role_weight:
    coordinator: 1.0
    consolidator: 0.9
    distributor: 0.8
    transit: 0.6
    terminal: 0.5
    peripheral: 0.1
  seed_priority_factor: 0.85   # seeds are already known; the case asks to look above them
  removal_candidates: 100      # removal impact reruns seed flow per node, so only for the top 100 pre-ranked
  top_n: 30

resilience:
  n_removed: [0, 5, 10, 20, 50]
  random_draws: 5              # random removal is averaged over 5 draws
  random_seed: 42

data_requests:
  small_component_max: 20      # weak components below this size aren't linked to the main network

centrality:
  betweenness_samples: null    # production remains exact; benchmark opts into a bounded sample explicitly
  seed: 42                    # repeatable sampled centrality and synthetic graph lift

explainability:
  top_seed_paths: 5            # compact dossier: show top five contributions and disclose remaining modeled KZT

benchmark:
  scales: [1, 10, 100]
  betweenness_samples: 32      # fixed number of source pivots, reported separately from production exact mode
  seed: 42                    # deterministic degree-preserving graph lifts
